name: Vaitcraft APK

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "ABI a compilar (arm64 sirve para casi todos los móviles actuales)"
        type: choice
        options: ["arm64", "arm", "x86_64", "x86", "all"]
        default: "arm64"
      variant:
        description: "Release (firmado, minificado) o Debug"
        type: choice
        options: ["Release", "Debug"]
        default: "Release"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: "on-failure"

      - name: Prepare signing key (Release)
        if: inputs.variant == 'Release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD_SECRET" ] && [ -n "$KEY_PASSWORD_SECRET" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ZalithLauncher/vaitcraft.jks
            echo "STORE_PASSWORD=$STORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin secretos KEYSTORE_BASE64/STORE_PASSWORD/KEY_PASSWORD: se usa una clave temporal. Este APK no podra actualizar a otro firmado con una clave distinta."
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -keystore ZalithLauncher/vaitcraft.jks -alias vaitcraft \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Vaitcraft"
            echo "STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
          fi

      - name: Build APK (${{ inputs.variant }}, ${{ inputs.arch }})
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assemble${{ inputs.variant }} -Darch=${{ inputs.arch }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Vaitcraft-${{ inputs.variant }}-${{ inputs.arch }}
          path: ZalithLauncher/build/outputs/apk/**/*.apk
          if-no-files-found: error
