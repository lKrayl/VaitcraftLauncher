name: Vaitcraft Android CI

on:
  push:
    branches:
      - fix/security-and-vaitcraft-bootstrap
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :ZalithLauncher:assembleDebug :ZalithLauncher:testDebugUnitTest -Darch=arm64 --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Vaitcraft-debug-arm64
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error